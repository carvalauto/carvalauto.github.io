<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting</title>
<script>
(function(){
  const path = location.pathname;
  const search = location.search;
  // 兼容旧版 /product.html?id=xxx 自动跳转到新版 /products/xxx.html
  if(path === '/product.html' && search.includes('id=')){
    const idStr = new URLSearchParams(search).get('id');
    if(idStr){
      location.href = `/products/${idStr}.html`;
      return;
    }
  }
  // 存储原始路由，首页前端读取恢复页面
  sessionStorage.setItem('spa_route', path + search + location.hash);
  // 全部不存在页面跳转首页
  location.replace('/');
})();
</script>
</head>
<body>
Loading page...
</body>
</html>
